name: Daily Snapshot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot
        run: npm run snapshot

      - name: Validate snapshot structure
        run: npx tsx -e "
          import { readFileSync } from 'node:fs';
          import { resolve } from 'node:path';
          import { createHash } from 'node:crypto';
          const data = readFileSync(resolve('src/lib/snapshot-data.ts'), 'utf-8');
          const match = data.match(/const data: Snapshot = (.+?);\nexport default data;/s);
          if (!match) { console.error('FAIL: could not parse snapshot-data.ts'); process.exit(1); }
          const snapshot = JSON.parse(match[1]);
          if (!snapshot.isoDate) { console.error('FAIL: missing isoDate'); process.exit(1); }
          if (!snapshot.hash) { console.error('FAIL: missing hash'); process.exit(1); }
          if (!Array.isArray(snapshot.records)) { console.error('FAIL: missing records'); process.exit(1); }
          const recordsJson = JSON.stringify(snapshot.records, null, 2);
          const computed = createHash('sha256').update(recordsJson, 'utf-8').digest('hex');
          if (computed !== snapshot.hash) { console.error('FAIL: integrity hash mismatch'); process.exit(1); }
          console.log('OK: snapshot valid, date=' + snapshot.isoDate + ', records=' + snapshot.records.length + ', hash=' + snapshot.hash);
        "

      - name: Archive snapshot data
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-data-${{ github.run_id }}
          path: data/
          retention-days: 90

      - name: Archive generated TypeScript module
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-module-${{ github.run_id }}
          path: src/lib/snapshot-data.ts
          retention-days: 90
