name: Daily Snapshot

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot
        run: npm run snapshot

      - name: Validate snapshot structure
        run: npx tsx scripts/validate-snapshot.ts

      - name: Archive snapshot data
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-data-${{ github.run_id }}
          path: data/
          retention-days: 90

      - name: Archive generated TypeScript module
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-module-${{ github.run_id }}
          path: src/lib/snapshot-data.ts
          retention-days: 90
